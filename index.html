<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Page Tool</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1c2030;--muted:#6b7285;--line:#e1e4ed;--pri:#4f46e5;--del:#dc2626;--ext:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--text:#eceef5;--muted:#9aa1b5;--line:#2c3040;--pri:#818cf8;--del:#f87171;--ext:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e29;--text:#eceef5;--muted:#9aa1b5;--line:#2c3040;--pri:#818cf8;--del:#f87171;--ext:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 8px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:40px 16px;text-align:center;cursor:pointer;transition:.15s}
.drop.over,.drop:hover{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,transparent)}
.drop b{display:block;font-size:1.1rem;margin-bottom:4px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 16px}
button:hover:not(:disabled){border-color:var(--pri)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
:root:not([data-theme="light"]) button.pri{color:#10121a}
.info{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;justify-content:space-between}
.info div span{display:block;color:var(--muted);font-size:.8rem}
.info div strong{word-break:break-all}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{padding:14px;text-align:center;font-weight:600;border-width:2px}
.mode small{display:block;font-weight:400;color:var(--muted)}
.mode.on[data-m="delete"]{border-color:var(--del);color:var(--del)}
.mode.on[data-m="extract"]{border-color:var(--ext);color:var(--ext)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:170px}
.count{margin-inline-start:auto;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pg{position:relative;border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;background:var(--bg);text-align:center;user-select:none}
.pg .th{min-height:150px;display:flex;align-items:center;justify-content:center}
.pg canvas{max-width:100%;height:auto;display:block;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pg .n{font-size:.85rem;color:var(--muted);margin-top:4px}
.pg .ck{position:absolute;top:8px;inset-inline-end:8px;width:24px;height:24px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff}
.pg.s .ck{border-color:transparent}
.del .pg.s{border-color:var(--del);background:color-mix(in srgb,var(--del) 12%,var(--bg))}
.del .pg.s .ck{background:var(--del)}
.del .pg.s canvas{opacity:.4}
.ext .pg.s{border-color:var(--ext);background:color-mix(in srgb,var(--ext) 12%,var(--bg))}
.ext .pg.s .ck{background:var(--ext)}
.msg{padding:10px 14px;border-radius:10px;margin-bottom:12px;display:none}
.msg.err{display:block;background:color-mix(in srgb,var(--del) 14%,transparent);color:var(--del);border:1px solid var(--del)}
.msg.ok{display:block;background:color-mix(in srgb,var(--ext) 14%,transparent);color:var(--ext);border:1px solid var(--ext)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hide{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal>div{background:var(--card);border-radius:14px;max-width:960px;width:100%;max-height:88vh;display:flex;flex-direction:column;padding:16px}
.modal .grid{overflow:auto;padding:4px}
.modal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
a.dl{display:inline-block;text-decoration:none;background:var(--ext);color:#10121a;font-weight:700;padding:10px 18px;border-radius:10px}
footer{text-align:center;color:var(--muted);padding:20px 16px 28px;font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>PDF Page Tool</h1>
  <p class="sub">Delete pages or extract pages. Your file is processed locally in your browser and never uploaded.</p>

  <div id="msg" class="msg"></div>

  <div class="card" id="upCard">
    <div class="drop" id="drop" tabindex="0">
      <b>Drag &amp; drop a PDF here</b>
      <span style="color:var(--muted)">or</span><br><br>
      <button class="pri" id="browse" type="button">Browse files</button>
      <input type="file" id="file" accept="application/pdf,.pdf" class="hide">
    </div>
  </div>

  <div id="work" class="hide">
    <div class="card info">
      <div><span>File name</span><strong id="iName"></strong></div>
      <div><span>File size</span><strong id="iSize"></strong></div>
      <div><span>Total pages</span><strong id="iPages"></strong></div>
      <button id="change" type="button">Change file</button>
    </div>

    <div class="card">
      <div class="modes">
        <button class="mode on" data-m="delete" type="button">Delete Pages<small>Remove selected pages</small></button>
        <button class="mode" data-m="extract" type="button">Extract Pages<small>Keep only selected pages</small></button>
      </div>
    </div>

    <div class="card">
      <div class="bar">
        <button id="all" type="button">Select all</button>
        <button id="none" type="button">Clear</button>
        <button id="inv" type="button">Invert</button>
        <input id="range" placeholder="e.g. 1-3, 5, 8-10" aria-label="Page range">
        <button id="addRange" type="button">Select range</button>
        <span class="count" id="cnt"></span>
      </div>
      <div id="grid" class="grid del"></div>
    </div>

    <div class="card actions">
      <button id="prev" type="button">Preview result</button>
      <button id="go" class="pri" type="button">Delete selected pages</button>
      <span id="res" class="hide actions"></span>
    </div>
  </div>
</div>

<div id="modal" class="modal hide">
  <div>
    <header><strong id="mTitle"></strong><button id="mClose" type="button">Close</button></header>
    <div id="mGrid" class="grid"></div>
  </div>
</div>

<footer>build by abdullah mostafa</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let bytes = null, pdfDoc = null, total = 0, mode = 'delete', sel = new Set(), fileName = '', outUrl = null;
let queue = Promise.resolve();

function showMsg(t, type) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (type || 'err'); if (t) m.scrollIntoView({block:'nearest'}); }
function clearMsg() { $('msg').className = 'msg'; $('msg').textContent = ''; }
function fmtSize(b) { return b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB'; }

// ---------- Upload ----------
const drop = $('drop');
$('browse').onclick = e => { e.stopPropagation(); $('file').click(); };
drop.onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; };
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
$('change').onclick = () => $('file').click();

async function loadFile(file) {
  clearMsg();
  try {
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') throw new Error('This is not a PDF file. Please choose a .pdf file.');
    if (!file.size) throw new Error('The file is empty.');
    const buf = await file.arrayBuffer();
    const head = new TextDecoder('latin1').decode(new Uint8Array(buf, 0, Math.min(1024, buf.byteLength)));
    if (!head.includes('%PDF-')) throw new Error('Invalid PDF: the file does not have a valid PDF header.');

    let doc;
    try { doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise; }
    catch (e) {
      if (e && e.name === 'PasswordException') throw new Error('This PDF is password-protected and cannot be processed.');
      throw new Error('Could not read this PDF. The file may be corrupted.');
    }
    let libCount;
    try { libCount = (await PDFLib.PDFDocument.load(buf.slice(0))).getPageCount(); }
    catch (e) { throw new Error('This PDF is encrypted or damaged and cannot be processed safely.'); }
    if (libCount !== doc.numPages) throw new Error(`Page count mismatch (${doc.numPages} vs ${libCount}). The file cannot be processed reliably.`);

    if (pdfDoc) pdfDoc.destroy();
    bytes = buf; pdfDoc = doc; total = doc.numPages; fileName = file.name; sel.clear();
    $('iName').textContent = file.name; $('iSize').textContent = fmtSize(file.size); $('iPages').textContent = total;
    $('upCard').classList.add('hide'); $('work').classList.remove('hide');
    setMode('delete'); buildGrid();
  } catch (e) { showMsg(e.message); }
}

// ---------- Rendering ----------
function renderPage(i, width) {
  return queue = queue.then(async () => {
    const page = await pdfDoc.getPage(i);
    const v1 = page.getViewport({ scale: 1 });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vp = page.getViewport({ scale: (width / v1.width) * dpr });
    const c = document.createElement('canvas');
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    c.style.aspectRatio = c.width + '/' + c.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    page.cleanup();
    return c;
  });
}
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    io.unobserve(en.target);
    const th = en.target.querySelector('.th');
    renderPage(+en.target.dataset.i, 200).then(c => { th.textContent = ''; th.appendChild(c); })
      .catch(() => { th.textContent = 'Preview unavailable'; });
  });
}, { rootMargin: '300px' });

function buildGrid() {
  io.disconnect();
  const g = $('grid'); g.textContent = '';
  for (let i = 1; i <= total; i++) {
    const d = document.createElement('div');
    d.className = 'pg'; d.dataset.i = i;
    d.innerHTML = '<div class="ck"></div><div class="th">…</div><div class="n">Page ' + i + '</div>';
    d.onclick = () => toggle(i);
    g.appendChild(d); io.observe(d);
  }
  refresh();
}

// ---------- Selection ----------
function toggle(i) { sel.has(i) ? sel.delete(i) : sel.add(i); refresh(); }
function refresh() {
  document.querySelectorAll('#grid .pg').forEach(d => {
    const on = sel.has(+d.dataset.i);
    d.classList.toggle('s', on);
    d.querySelector('.ck').textContent = on ? (mode === 'delete' ? '✕' : '✓') : '';
  });
  const list = [...sel].sort((a, b) => a - b);
  $('cnt').textContent = sel.size ? `${sel.size} selected: ${list.length > 12 ? list.slice(0, 12).join(', ') + '…' : list.join(', ')}` : 'No pages selected';
  const n = sel.size;
  const bad = mode === 'delete' ? (n === 0 || n >= total) : n === 0;
  $('go').disabled = bad; $('prev').disabled = bad;
  hideResult();
}
function setMode(m) {
  mode = m; sel.clear();
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('grid').className = 'grid ' + (m === 'delete' ? 'del' : 'ext');
  $('go').textContent = m === 'delete' ? 'Delete selected pages' : 'Extract selected pages';
  clearMsg(); refresh();
}
document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.m));
$('all').onclick = () => { for (let i = 1; i <= total; i++) sel.add(i); refresh(); };
$('none').onclick = () => { sel.clear(); refresh(); };
$('inv').onclick = () => { for (let i = 1; i <= total; i++) sel.has(i) ? sel.delete(i) : sel.add(i); refresh(); };
$('addRange').onclick = addRange;
$('range').onkeydown = e => { if (e.key === 'Enter') addRange(); };
function addRange() {
  clearMsg();
  const txt = $('range').value.trim(); if (!txt) return;
  const found = [];
  for (const part of txt.split(/[,\s]+/).filter(Boolean)) {
    const m = part.match(/^(\d+)(?:-(\d+))?$/);
    if (!m) return showMsg(`Invalid range "${part}". Use a format like 1-3, 5, 8-10.`);
    const a = +m[1], b = m[2] ? +m[2] : a;
    if (a < 1 || b > total || a > b) return showMsg(`Range "${part}" is outside 1–${total}.`);
    for (let i = a; i <= b; i++) found.push(i);
  }
  found.forEach(i => sel.add(i)); $('range').value = ''; refresh();
}

// ---------- Result helpers ----------
function keepList() {
  const all = Array.from({ length: total }, (_, i) => i + 1);
  return mode === 'delete' ? all.filter(i => !sel.has(i)) : all.filter(i => sel.has(i));
}
function validateSelection() {
  for (const i of sel) if (!Number.isInteger(i) || i < 1 || i > total) throw new Error('Invalid page selection.');
  if (mode === 'delete' && sel.size === 0) throw new Error('Select at least one page to delete.');
  if (mode === 'delete' && sel.size >= total) throw new Error('You cannot delete every page — the result would be an empty PDF.');
  if (mode === 'extract' && sel.size === 0) throw new Error('Select at least one page to extract.');
  const k = keepList();
  const expected = mode === 'delete' ? total - sel.size : sel.size;
  if (k.length !== expected || k.length < 1) throw new Error('Internal check failed: unexpected number of output pages.');
  return k;
}

// ---------- Preview ----------
$('prev').onclick = async () => {
  clearMsg();
  let k; try { k = validateSelection(); } catch (e) { return showMsg(e.message); }
  $('mTitle').textContent = `Preview: ${k.length} page${k.length > 1 ? 's' : ''} in the new PDF`;
  const g = $('mGrid'); g.textContent = '';
  $('modal').classList.remove('hide');
  const token = g.token = Symbol();
  for (const i of k) {
    if (g.token !== token) return;
    const d = document.createElement('div'); d.className = 'pg';
    d.style.cursor = 'default';
    d.innerHTML = '<div class="th">…</div><div class="n">Original page ' + i + '</div>';
    g.appendChild(d);
    try { const c = await renderPage(i, 200); d.querySelector('.th').textContent = ''; d.querySelector('.th').appendChild(c); }
    catch (e) { d.querySelector('.th').textContent = 'Preview unavailable'; }
  }
};
$('mClose').onclick = () => { $('mGrid').token = null; $('modal').classList.add('hide'); };
$('modal').onclick = e => { if (e.target.id === 'modal') $('mClose').onclick(); };

// ---------- Process ----------
function hideResult() {
  $('res').classList.add('hide'); $('res').textContent = '';
  if (outUrl) { URL.revokeObjectURL(outUrl); outUrl = null; }
}
$('go').onclick = async () => {
  clearMsg(); hideResult();
  const btn = $('go'), label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Processing…';
  try {
    const k = validateSelection();
    const src = await PDFLib.PDFDocument.load(bytes.slice(0));
    if (src.getPageCount() !== total) throw new Error('The source document changed unexpectedly.');
    const out = await PDFLib.PDFDocument.create();
    const pages = await out.copyPages(src, k.map(i => i - 1));
    pages.forEach(p => out.addPage(p));
    const outBytes = await out.save();

    // Validate result with two independent readers
    const expected = mode === 'delete' ? total - sel.size : sel.size;
    const chk = await PDFLib.PDFDocument.load(outBytes.slice(0));
    if (chk.getPageCount() !== expected) throw new Error(`Validation failed: expected ${expected} pages, got ${chk.getPageCount()}.`);
    const t = await pdfjsLib.getDocument({ data: new Uint8Array(outBytes.slice(0)) }).promise;
    const n = t.numPages; t.destroy();
    if (n !== expected) throw new Error(`Validation failed: PDF reader sees ${n} pages, expected ${expected}.`);

    const blob = new Blob([outBytes], { type: 'application/pdf' });
    outUrl = URL.createObjectURL(blob);
    const base = fileName.replace(/\.pdf$/i, '');
    const a = document.createElement('a');
    a.className = 'dl'; a.href = outUrl;
    a.download = `${base}-${mode === 'delete' ? 'pages-deleted' : 'pages-extracted'}.pdf`;
    a.textContent = `Download new PDF (${n} pages, ${fmtSize(blob.size)})`;
    $('res').textContent = ''; $('res').appendChild(a); $('res').classList.remove('hide');
    showMsg(`Done and verified: the new PDF has ${n} page${n > 1 ? 's' : ''} (original: ${total}).`, 'ok');
  } catch (e) { showMsg(e.message || 'Something went wrong while processing the PDF.'); }
  finally { btn.textContent = label; const bad = mode === 'delete' ? (sel.size === 0 || sel.size >= total) : sel.size === 0; btn.disabled = bad; }
};
</script>
</body>
</html>
